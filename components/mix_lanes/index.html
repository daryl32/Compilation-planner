<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --fg:#262730; --muted:#8a8f98; --line:#d9dce1; --accent:#ff4b4b; --panel:#f3f4f7; --cursor:#ff4b4b;
          /* the waveform "stage" is dark in both themes — waveforms read better on dark */
          --stage:#15171e; --stage-fg:#e8eaf0; --stage-muted:#9aa0aa; --stage-line:rgba(255,255,255,.10);
          --vox:rgba(236,72,153,0.9); --drums:rgba(245,158,11,0.9); --dim:rgba(150,150,160,0.35);
          --join:rgba(150,110,255,0.20); --amber:rgba(245,170,40,0.38); }
  html, body { margin:0; padding:0; background:transparent; color:var(--fg);
               font-family: "Source Sans Pro", -apple-system, system-ui, sans-serif; font-size:15px;
               -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color: transparent; }
  .bar { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin:4px 0; }
  button { min-height:44px; min-width:44px; padding:0 12px; border-radius:8px; border:1px solid var(--line);
           background:var(--panel); color:var(--fg); font-size:15px; cursor:pointer; touch-action:manipulation; }
  button:active { transform: scale(0.97); }
  button.on { outline:2px solid var(--accent); background:var(--accent); color:#fff; }
  button:disabled { opacity:.4; cursor:default; }
  .time { font-variant-numeric: tabular-nums; min-width:96px; text-align:center; font-weight:600; }
  .grow { flex:1; }
  canvas { display:block; width:100%; touch-action:none; border-radius:10px; background:var(--stage); }
  .hint { color:var(--muted); font-size:13px; margin-top:4px; min-height:18px; }
</style>
</head>
<body>
<div class="bar" id="btns">
  <button id="pm" title="Play the previewed mix from where you last tapped">▶ Mix</button>
  <button id="lj" title="Tap a join pill, then loop just that join — change it and you hear the change">🔁 Join</button>
  <span id="parts"></span>
  <span class="time" id="time">—</span>
  <span class="grow"></span>
  <button id="zout" title="Zoom out (or pinch)">−</button>
  <button id="zin" title="Zoom in (or pinch)">+</button>
  <button id="all" title="Show the whole mix">⤢ All</button>
</div>
<canvas id="cv"></canvas>
<div class="hint" id="hint"></div>

<script>
/* 🎚️ Mashup lanes — each part on its own lane where it plays in the mix.
   • the strip at the top is the whole mix: tap or drag it to move around; pinch the lanes to zoom
   • each lane: its sections on a strip above (bright = high energy), the waveform coloured by sound —
     deep blue = bass-heavy, pale = bright, pink = vocals, orange = drums — with 8 / 16-bar phrase lines
   • ▌ ▐ handles trim a part; the pill between two lanes is their join: tap it to edit, drag it to move the
     hand-over (both parts move together, clicking onto phrases)
   Returns {"uid","start","end","nonce"} after a trim, {"join","a_uid","a_end","b_start","nonce"} after a join drag,
   {"join","open":true,"nonce"} after a tap on a join (mix_ui._mashup_lanes). */
function post(type, extra) { window.parent.postMessage(Object.assign({isStreamlitMessage: true, type: type}, extra || {}), "*"); }
function setHeight() { post("streamlit:setFrameHeight", {height: document.body.scrollHeight + 4}); }
function sendValue(v) { post("streamlit:setComponentValue", {value: v, dataType: "json"}); }
const $ = id => document.getElementById(id);
const cv = $("cv");
let D = null, view = {start: 0, span: 60}, drag = null, playing = null, cue = {M: 0}, edits = {}, pills = [];
const ptrs = new Map(); let pinch = null;
let audio = new Audio(); audio.preload = "auto";
const OV_H = 30, RULER = 20, RIB = 16, LANE_H = 60, GAP = 30;
const HINT = "Tap or drag the strip at the top to move around · pinch to zoom · drag a part's ▌ ▐ ends to trim it · " +
             "tap a join pill to edit it, drag it to move the hand-over (it clicks onto phrases — the brighter lines) · " +
             "tap a lane to set where ▶ plays from";

function fmt(t) { t = Math.max(0, t || 0); const m = Math.floor(t / 60), s = t - m * 60; return m + ":" + (s < 10 ? "0" : "") + s.toFixed(1); }
function css(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function clip(x, a, b) { return Math.max(a, Math.min(b, x)); }
function nearest(arr, t) { let best = t, d = 1e9; for (const x of arr) { const e = Math.abs(x - t); if (e < d) { d = e; best = x; } } return best; }
// 🎯 Magnetic snapping: an 8 / 16-bar phrase or a section start when within 1½ bars of one, else the nearest bar line.
function magnet(trk, t, extra) {
  const bl = trk.bar_len || 2, ph = trk.phrases || [];
  let best = null, d = 1e9;
  for (const [x] of ph) { const e = Math.abs(x - t); if (e < d) { d = e; best = x; } }
  const snapped = (best !== null && d <= 1.5 * bl) ? best : nearest(trk.bars.concat(extra || []), t);
  return {t: snapped, label: placeLabel(trk, snapped)};
}
function placeLabel(trk, t) {
  let bi = 0, d = 1e9; trk.bars.forEach((b, i) => { const e = Math.abs(b - t); if (e < d) { d = e; bi = i; } });
  const sec = (trk.sections || []).filter(s => s.t <= t + 1e-3).pop();
  const onPhrase = (trk.phrases || []).some(([x]) => Math.abs(x - t) < 1e-3);
  const onSection = (trk.sections || []).some(s => Math.abs(s.t - t) < 0.05);
  return `${fmt(t)} · bar ${bi + 1}` + (onSection ? ` · start of ${sec ? sec.label : "a section"}` : onPhrase ? " · phrase" : "");
}
function fit(c) {
  const r = c.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  if (c.width !== Math.round(r.width * dpr) || c.height !== Math.round(r.height * dpr)) {
    c.width = Math.round(r.width * dpr); c.height = Math.round(r.height * dpr); }
  const g = c.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0); return [g, r.width, r.height];
}
function P(i) { const L = D.lanes[i], e = edits[L.uid]; return e ? Object.assign({}, L, e) : L; }   // with a drag applied
function toMix(L, src) { return L.out_start + (src - L.start) / L.speed; }
function toSrc(L, x) { return L.start + (x - L.out_start) * L.speed; }
function laneTop(i) { return OV_H + RULER + i * (RIB + LANE_H + GAP); }
function totalH() { const n = D.lanes.length; return OV_H + RULER + n * (RIB + LANE_H) + Math.max(0, n - 1) * GAP + 8; }

// 🎨 the waveform's body colour: deep blue when the sound is bass-heavy (dull), pale steel when it's bright
const LO = [70, 105, 235], HI = [182, 194, 216];
function body(b) { const k = clip(b, 0, 1); return `rgb(${LO.map((v, i) => Math.round(v + (HI[i] - v) * k)).join(",")})`; }

function drawLane(g, w, X, L, top) {
  const t0 = view.start, t1 = view.start + view.span, y = top + RIB, h = LANE_H, mid = y + h / 2, amp = h / 2 - 3, trk = L.trk;
  const play0 = L.out_start - (L.head || 0), play1 = L.out_end + (L.tail || 0);
  // the section strip: where each section of this song falls, bright amber for the high-energy ones
  const secs = trk.sections || [];
  for (let i = 0; i < secs.length; i++) {
    const a = Math.max(toMix(L, secs[i].t), play0), b = Math.min(toMix(L, i + 1 < secs.length ? secs[i + 1].t : trk.duration), play1);
    if (b <= a || X(b) < 0 || X(a) > w) continue;
    const xa = Math.max(0, X(a)), xb = Math.min(w, X(b));
    g.fillStyle = (secs[i].energy || 0) >= 0.66 ? css("--amber") : "rgba(255,255,255,.07)"; g.fillRect(xa, top, xb - xa - 1, RIB - 2);
    g.fillStyle = css("--stage-fg"); g.globalAlpha = 0.9; g.font = "11px sans-serif";
    const txt = `${secs[i].label} · ${secs[i].bars}`;
    if (xb - xa > g.measureText(txt).width + 8) g.fillText(txt, xa + 4, top + RIB - 5);
    g.globalAlpha = 1;
  }
  // the waveform, one column a pixel
  for (let px = 0; px < w; px++) {
    const xa = t0 + (t1 - t0) * px / w, xb = t0 + (t1 - t0) * (px + 1) / w;
    const sa = toSrc(L, xa), sb = toSrc(L, xb);
    if (sb < 0 || sa > trk.duration) continue;
    let e = 0, v = 0, k = 0, br = 0, lo = 0, n = 0;
    for (let i = Math.floor(Math.min(sa, sb) * trk.rate); i <= Math.floor(Math.max(sa, sb) * trk.rate); i++) {
      e = Math.max(e, trk.env[i] || 0); v = Math.max(v, trk.vox ? (trk.vox[i] || 0) : 0); k = Math.max(k, trk.drums ? (trk.drums[i] || 0) : 0);
      br += trk.bright ? (trk.bright[i] || 0) : 0.45; lo = Math.max(lo, trk.low ? (trk.low[i] || 0) : 0); n++; }
    br /= Math.max(n, 1);
    const inPart = xa >= L.out_start - 1e-3 && xa <= L.out_end + 1e-3, inJoin = !inPart && xa >= play0 && xa <= play1;
    if (!inPart && !inJoin) { g.globalAlpha = 0.35; g.fillStyle = css("--dim"); g.fillRect(px, mid - e * amp, 1, 2 * e * amp); continue; }
    g.globalAlpha = inJoin ? 0.55 : 1;
    g.fillStyle = body(br); g.fillRect(px, mid - e * amp, 1, 2 * e * amp);
    if (lo > 0.05) { const c = Math.min(e, lo) * amp * 0.75; g.fillStyle = "rgb(44,72,210)"; g.fillRect(px, mid - c, 1, 2 * c); }
    if (v > 0.05) { g.fillStyle = css("--vox"); g.fillRect(px, mid - e * amp, 1, Math.min(v, e) * amp * 0.55); }
    if (k > 0.05) { const kk = Math.min(k, e) * amp * 0.55; g.fillStyle = css("--drums"); g.fillRect(px, mid + e * amp - kk, 1, kk); }
  }
  g.globalAlpha = 1;
  // 🎯 phrase lines (what drags click onto)
  const p0 = X(play0), p1 = X(play1);
  for (const [t, wgt] of (trk.phrases || [])) {
    const x = X(toMix(L, t)); if (x < p0 - 1 || x > p1 + 1 || x < 0 || x > w) continue;
    g.globalAlpha = 0.18 + 0.4 * wgt; g.fillStyle = css("--stage-fg"); g.fillRect(x, y + 2, 1, h - 4); }
  g.globalAlpha = 1;
  // the part's colour along its edge, its handles and its name
  g.fillStyle = L.colour; g.fillRect(X(L.out_start), y + h - 3, X(L.out_end) - X(L.out_start), 3);
  for (const [x, side] of [[L.out_start, "s"], [L.out_end, "e"]]) {
    const xx = X(x); g.fillStyle = "#f4f5f8"; g.globalAlpha = 0.95;
    g.fillRect(side === "s" ? xx : xx - 7, y + 3, 7, h - 6); g.fillStyle = "#15171e";
    g.fillRect(side === "s" ? xx + 3 : xx - 4, mid - 8, 1, 16); g.globalAlpha = 1; }
  const label = `${L.idx + 1}. ${L.label}  ${fmt(L.start)}–${fmt(L.end)}`;
  g.font = "bold 12px sans-serif"; const lx = clip(X(L.out_start) + 10, 4, Math.max(4, X(L.out_end) - 40));
  g.fillStyle = "rgba(21,23,30,.7)"; g.fillRect(lx - 3, y + 3, g.measureText(label).width + 6, 16);
  g.fillStyle = css("--stage-fg"); g.fillText(label, lx, y + 15);
}

function drawOverview(g, w) {
  const dur = Math.max(D.duration, 1), Xo = t => t / dur * w;
  g.fillStyle = "rgba(255,255,255,.05)"; g.fillRect(0, 0, w, OV_H - 6);
  D.lanes.forEach((L0, i) => { const L = P(i), trk = L.trk;
    const x0 = Xo(L.out_start), x1 = Xo(L.out_end);
    g.fillStyle = L.colour; g.globalAlpha = 0.35; g.fillRect(x0, 2, x1 - x0, OV_H - 10); g.globalAlpha = 0.9;
    for (let px = Math.floor(x0); px < x1; px++) {
      const s = toSrc(L, px / w * dur), e = trk.env[Math.floor(s * trk.rate)] || 0, hh = e * (OV_H - 12);
      g.fillStyle = L.colour; g.fillRect(px, (OV_H - 6) / 2 - hh / 2, 1, hh); }
    g.globalAlpha = 1; });
  // the part of the mix the lanes show
  g.strokeStyle = "#ffffff"; g.lineWidth = 1.5;
  g.strokeRect(Xo(view.start) + 0.5, 1, Math.max(4, Xo(view.start + view.span) - Xo(view.start)) - 1, OV_H - 8);
  const c = curX(); if (c) { g.fillStyle = css("--cursor"); g.fillRect(Xo(c.x) - 1, 0, 2, OV_H - 6); }
}

function drawPills(g, w, X) {
  pills = [];
  (D.joins || []).forEach((J, k) => {
    if (k + 1 >= D.lanes.length) return;
    const A = P(k), at = A.out_end, x = X(at), y = laneTop(k) + RIB + LANE_H + GAP / 2;
    if (x < -40 || x > w + 40) return;
    const moving = drag && drag.kind === "join" && drag.k === k;
    const txt = moving && drag.tag ? drag.tag : ((J.rough ? "⚠ " : "") + (J.label || "join"));
    g.font = "bold 12px sans-serif"; const tw = g.measureText(txt).width + 22, x0 = clip(x - tw / 2, 2, w - tw - 2);
    g.strokeStyle = "rgba(255,255,255,.35)"; g.setLineDash([3, 3]); g.beginPath();
    g.moveTo(x, laneTop(k) + RIB); g.lineTo(x, laneTop(k + 1) + RIB + LANE_H); g.stroke(); g.setLineDash([]);
    g.fillStyle = J.rough ? "#fff4e5" : "#ffffff"; g.strokeStyle = J.neural ? "#8b5cf6" : (J.rough ? "#f59e0b" : "#c9ccd4");
    g.lineWidth = moving ? 2.5 : 1.5;
    roundRect(g, x0, y - 12, tw, 24, 12); g.fill(); g.stroke();
    g.fillStyle = "#1f2129"; g.fillText(txt, x0 + 11, y + 4);
    pills.push({k, x0, x1: x0 + tw, y0: y - 16, y1: y + 16});
  });
}
function roundRect(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }

function draw() {
  if (!D) return;
  cv.style.height = totalH() + "px";
  const [g, w, h] = fit(cv);
  g.clearRect(0, 0, w, h);
  const t0 = view.start, t1 = view.start + view.span, X = t => (t - t0) / (t1 - t0) * w, T = x => t0 + x / w * (t1 - t0);
  drawOverview(g, w);
  // ruler: mix time
  g.fillStyle = css("--stage-muted"); g.font = "11px sans-serif";
  const step = view.span > 240 ? 60 : view.span > 120 ? 30 : view.span > 40 ? 10 : view.span > 12 ? 5 : 1;
  for (let t = Math.ceil(t0 / step) * step; t < t1; t += step) { const x = X(t); g.fillRect(x, OV_H + RULER - 6, 1, 6); g.fillText(fmt(t).replace(".0", ""), x + 2, OV_H + 11); }
  // the joins' blends, behind the lanes
  (D.joins || []).forEach((J, k) => { const A = P(k), d = A.out_end - J.at;
    g.fillStyle = css("--join"); g.fillRect(X(J.at + d - J.pre), OV_H + RULER, X(J.at + d + J.post) - X(J.at + d - J.pre), h - OV_H - RULER); });
  const geo = [];
  for (let i = 0; i < D.lanes.length; i++) { const L = P(i), top = laneTop(i); drawLane(g, w, X, L, top); geo.push({y: top + RIB, L}); }
  drawPills(g, w, X);
  // cursor / cue
  const c = curX();
  g.strokeStyle = css("--cursor"); g.lineWidth = 2;
  if (c) { const [y0, y1] = c.lane === null ? [OV_H + RULER, h] : [geo[c.lane].y, geo[c.lane].y + LANE_H];
           g.beginPath(); g.moveTo(X(c.x), y0); g.lineTo(X(c.x), y1); g.stroke(); }
  else { g.globalAlpha = 0.6; g.beginPath(); g.moveTo(X(cue.M), OV_H + RULER); g.lineTo(X(cue.M), h); g.stroke(); g.globalAlpha = 1; }
  // while trimming: where the handle has snapped to
  if (drag && drag.tag && (drag.kind === "s" || drag.kind === "e") && geo[drag.lane]) {
    const L = P(drag.lane), xx = X(drag.kind === "s" ? L.out_start : L.out_end), yy = geo[drag.lane].y - RIB - 2;
    g.font = "bold 12px sans-serif"; const tw = g.measureText(drag.tag).width + 12, x0 = clip(xx - tw / 2, 2, w - tw - 2);
    g.fillStyle = "#ffffff"; g.fillRect(x0, yy - 16, tw, 18); g.fillStyle = "#1f2129"; g.fillText(drag.tag, x0 + 6, yy - 3); }
  cv._geo = {X, T, geo, w};
}

// 🔁 Loop the open join: its quick render (the server re-mixes it after every change) plays in a loop here, and
// a new render takes over at the same point — so a change is heard a second or two later, without a tap
// (on an iPad sound may only start from a tap; once this loop is running, swaps don't need one).
let ctx = null, jsrc = null, jbuf = null, jurl = "", jt0 = 0, jloading = "";
async function loadJoin(url) {
  jloading = url;
  const r = await fetch(url); const ab = await r.arrayBuffer();
  const b = await new Promise((ok, no) => ctx.decodeAudioData(ab, ok, no));
  if (jloading !== url) return null;           // a newer render arrived meanwhile
  jloading = ""; return b;
}
function startJoinAt(b, url, offset) {
  if (jsrc) { try { jsrc.stop(); } catch (e) {} }
  jsrc = ctx.createBufferSource(); jsrc.buffer = b; jsrc.loop = true; jsrc.connect(ctx.destination);
  const off = Math.max(0, Math.min(offset, b.duration - 0.05));
  jsrc.start(0, off); jt0 = ctx.currentTime - off; jbuf = b; jurl = url; playing = "J"; setButtons();
}
async function loopJoin() {
  if (playing === "J") { stopJoin(); setButtons(); draw(); return; }
  const J = D.join_audio; if (!J || !J.url) return;
  stop();
  if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
  if (ctx.state === "suspended") await ctx.resume();
  $("lj").textContent = "⏳ Join"; 
  try { const b = await loadJoin(J.url); if (b) startJoinAt(b, J.url, 0); }
  catch (e) { $("hint").textContent = "Couldn't play the join: " + e; }
  setButtons();
}
async function swapJoin() {                    // a new render of the join: carry on from the same point
  const J = D.join_audio; if (playing !== "J" || !J || !J.url || J.url === jurl || jloading === J.url) return;
  try { const b = await loadJoin(J.url); if (!b || playing !== "J") return;
        const pos = jbuf ? (ctx.currentTime - jt0) % jbuf.duration : 0; startJoinAt(b, J.url, pos); }
  catch (e) {}
}
function stopJoin() { if (jsrc) { try { jsrc.stop(); } catch (e) {} } jsrc = null; if (playing === "J") playing = null; }
function curX() {
  if (playing === "J" && jbuf && D.join_audio) return {x: D.join_audio.mix_start + (ctx.currentTime - jt0) % jbuf.duration, lane: null};
  if (playing === "M") return {x: audio.currentTime, lane: null};
  if (typeof playing === "number") { const L = D.lanes[playing]; return {x: toMix(L, audio.currentTime), lane: playing}; }
  return null;
}
function stop() { audio.pause(); stopJoin(); playing = null; }
function play(which) {
  const was = playing; stop();
  if (was === which) { setButtons(); draw(); return; }
  let url, from;
  if (which === "M") { url = D.mix_url; from = cue.M; }
  else { const L = D.lanes[which]; url = L.trk.url; from = cue[L.uid] ?? L.start; }
  if (!url) return;
  if (audio.dataset.src !== url) { audio.src = url; audio.dataset.src = url; }
  const go = () => { try { audio.currentTime = Math.max(0, from); } catch (e) {}
                     audio.play().then(() => { playing = which; setButtons(); }).catch(() => {}); };
  if (audio.readyState >= 1) go(); else audio.addEventListener("loadedmetadata", go, {once: true});
}
audio.addEventListener("ended", () => { stop(); setButtons(); draw(); });
audio.addEventListener("timeupdate", () => {           // a part plays only its own stretch
  if (typeof playing === "number") { const L = D.lanes[playing]; if (audio.currentTime > L.end + 0.05) { stop(); setButtons(); draw(); } } });
function setButtons() {
  $("pm").disabled = !D.mix_url; $("pm").classList.toggle("on", playing === "M"); $("pm").textContent = playing === "M" ? "⏸ Mix" : "▶ Mix";
  $("pm").title = D.mix_url ? "Play the previewed mix from where you last tapped" : "Press ▶️ Preview first";
  const J = D.join_audio;
  $("lj").disabled = !(J && J.url) && playing !== "J"; $("lj").classList.toggle("on", playing === "J");
  $("lj").textContent = (playing === "J" ? "⏸ " : "🔁 ") + (J && J.label ? J.label : "Join");
  $("lj").title = J ? (J.url ? "Loop this join — change it and you hear the change a moment later" : "Mixing the join…")
                    : "Tap a join pill first, then loop just that join";
  const box = $("parts"); box.innerHTML = "";
  D.lanes.forEach((L, i) => { const b = document.createElement("button");
    b.textContent = (playing === i ? "⏸ " : "▶ ") + (i + 1); b.disabled = !L.trk.url; b.title = `Play part ${i + 1} (${L.label}) on its own`;
    b.style.borderColor = L.colour; b.style.borderWidth = "2px"; if (playing === i) b.classList.add("on");
    b.onclick = () => play(i); box.appendChild(b); box.appendChild(document.createTextNode(" ")); });
}
function updateTime() { const c = curX(); $("time").textContent = c ? fmt(c.x) : "from " + fmt(cue.M); }
function loop() { if (playing !== null && D) { const c = curX();
                    if (c && playing !== "J" && c.x > view.start + view.span * 0.92) view.start = c.x - view.span * 0.1; draw(); }
                  if (D) updateTime(); requestAnimationFrame(loop); }
function zoom(f, about) { const c = about ?? (view.start + view.span / 2); view.span = clip(view.span * f, 2, Math.max(D.duration * 1.2, 4));
  view.start = c - view.span / 2; draw(); }
$("pm").onclick = () => play("M");
$("lj").onclick = () => loopJoin();
$("zin").onclick = () => zoom(0.6); $("zout").onclick = () => zoom(1 / 0.6);
$("all").onclick = () => { view.start = 0; view.span = Math.max(D.duration, 4); draw(); };

function pos(ev) { const r = cv.getBoundingClientRect(); return {x: ev.clientX - r.left, y: ev.clientY - r.top}; }
function joinDrag(k, dt) {
  // move the hand-over between part k and part k + 1: A ends later / earlier (clicking onto its phrases), B starts
  // that much later / earlier in its own song, so the music either side of the join stays where it was
  const A = D.lanes[k], B = D.lanes[k + 1], bl = A.trk.bar_len || 2;
  const m = magnet(A.trk, clip(A.end + dt * A.speed, A.start + bl, A.trk.duration), [A.trk.duration]);
  const dOut = (m.t - A.end) / A.speed;
  const bStart = clip(nearest(B.trk.bars.concat([0]), B.start + dOut * B.speed), 0, B.end - (B.trk.bar_len || 2));
  const aOutEnd = A.out_start + (m.t - A.start) / A.speed;
  edits[A.uid] = {end: m.t, out_end: aOutEnd};
  edits[B.uid] = {start: bStart, out_start: aOutEnd, out_end: aOutEnd + (B.end - bStart) / B.speed};
  return `hand-over ${m.label} · ${B.label} from ${fmt(bStart)}`;
}
cv.addEventListener("pointerdown", ev => {
  if (!D || !cv._geo) return;
  cv.setPointerCapture(ev.pointerId);
  ptrs.set(ev.pointerId, pos(ev));
  if (ptrs.size === 2) {                                  // 🤏 pinch: zoom about the fingers' midpoint
    const [a, b] = [...ptrs.values()], w = cv._geo.w;
    pinch = {d0: Math.max(20, Math.hypot(a.x - b.x, a.y - b.y)), span0: view.span, start0: view.start, mid0: (a.x + b.x) / 2, w};
    drag = null; edits = {}; return;
  }
  const G = cv._geo, p = pos(ev);
  let kind = "pan", lane = null, k = null;
  if (p.y < OV_H) kind = "ov";
  else {
    const hit = pills.find(o => p.x >= o.x0 && p.x <= o.x1 && p.y >= o.y0 && p.y <= o.y1);
    if (hit) { kind = "join"; k = hit.k; }
    else if (p.y >= OV_H + RULER) {
      lane = G.geo.findIndex(o => p.y >= o.y - RIB && p.y <= o.y + LANE_H);
      if (lane >= 0) { const L = P(lane);
        if (Math.abs(p.x - G.X(L.out_start)) < 22) kind = "s"; else if (Math.abs(p.x - G.X(L.out_end)) < 22) kind = "e"; else kind = "lane"; }
      else lane = null;
    }
  }
  drag = {kind, lane, k, x0: p.x, moved: false, v0: view.start};
  if (kind === "ov") { view.start = clip(p.x / G.w * D.duration - view.span / 2, -view.span * 0.1, D.duration); drag.moved = true; draw(); }
});
cv.addEventListener("pointermove", ev => {
  if (!D) return;
  if (ptrs.has(ev.pointerId)) ptrs.set(ev.pointerId, pos(ev));
  if (pinch && ptrs.size >= 2) {
    const [a, b] = [...ptrs.values()], d = Math.max(20, Math.hypot(a.x - b.x, a.y - b.y)), mid = (a.x + b.x) / 2;
    const tm = pinch.start0 + pinch.mid0 / pinch.w * pinch.span0;
    view.span = clip(pinch.span0 * pinch.d0 / d, 2, Math.max(D.duration * 1.2, 4));
    view.start = tm - mid / pinch.w * view.span; draw(); return;
  }
  if (!drag) return;
  const p = pos(ev), dx = p.x - drag.x0, dt = dx / cv.getBoundingClientRect().width * view.span;
  if (Math.abs(dx) > 6) drag.moved = true;
  if (!drag.moved) return;
  if (drag.kind === "ov") view.start = clip(p.x / cv._geo.w * D.duration - view.span / 2, -view.span * 0.1, D.duration);
  else if (drag.kind === "pan" || drag.kind === "lane") view.start = drag.v0 - dt;
  else if (drag.kind === "join") drag.tag = joinDrag(drag.k, dt);
  else {
    const L = D.lanes[drag.lane], extra = [0, L.trk.duration];
    if (drag.kind === "s") { const m = magnet(L.trk, clip(L.start + dt * L.speed, 0, L.end - 1), extra);
      edits[L.uid] = {start: m.t, out_start: L.out_start + 0}; drag.tag = "starts " + m.label; }
    else { const m = magnet(L.trk, clip(L.end + dt * L.speed, L.start + 1, L.trk.duration), extra);
      edits[L.uid] = {end: m.t, out_end: L.out_start + (m.t - L.start) / L.speed}; drag.tag = "ends " + m.label; }
  }
  draw();
});
function endPointer(ev) {
  ptrs.delete(ev.pointerId);
  if (pinch) { if (ptrs.size < 2) pinch = null; drag = null; return; }
  if (!drag) return;
  const G = cv._geo, p = pos(ev);
  if (!drag.moved) {
    if (drag.kind === "join") { const J = D.joins[drag.k]; sendValue({join: J.uid, open: true, nonce: Date.now()}); }
    else {
      const x = G.T(p.x); cue.M = x;
      if (drag.lane !== null) { const L = D.lanes[drag.lane]; cue[L.uid] = clip(toSrc(L, x), L.start, L.end); }
      if (playing !== null) play(playing === "M" ? "M" : drag.lane ?? "M");
      draw();
    }
  } else if (drag.kind === "join" && edits[D.lanes[drag.k].uid]) {
    const A = D.lanes[drag.k], B = D.lanes[drag.k + 1], J = D.joins[drag.k];
    sendValue({join: J.uid, a_uid: A.uid, a_end: edits[A.uid].end, b_start: edits[B.uid].start, nonce: Date.now()});
  } else if ((drag.kind === "s" || drag.kind === "e") && edits[D.lanes[drag.lane].uid]) {
    const L = D.lanes[drag.lane], e = edits[L.uid];
    sendValue({uid: L.uid, start: e.start ?? L.start, end: e.end ?? L.end, nonce: Date.now()});
  }
  drag = null; draw();
}
cv.addEventListener("pointerup", endPointer);
cv.addEventListener("pointercancel", endPointer);
cv.addEventListener("wheel", ev => {                     // laptop: ctrl / pinch-trackpad zooms, a sideways scroll pans
  if (!D) return;
  const sideways = Math.abs(ev.deltaX) > Math.abs(ev.deltaY);
  if (!ev.ctrlKey && !sideways) return;                   // an up / down scroll scrolls the page
  ev.preventDefault();
  const G = cv._geo, about = G ? G.T(pos(ev).x) : undefined;
  if (ev.ctrlKey) zoom(Math.exp(ev.deltaY * 0.01), about);
  else { view.start += ev.deltaX / (G ? G.w : 800) * view.span; draw(); }
}, {passive: false});

function applyTheme(th) {
  if (!th) return; const r = document.documentElement.style;
  if (th.base === "dark") { r.setProperty("--panel", "#1f2129"); r.setProperty("--line", "#3a3d47"); r.setProperty("--muted", "#9aa0aa"); }
  if (th.textColor) r.setProperty("--fg", th.textColor);
  if (th.primaryColor) { r.setProperty("--accent", th.primaryColor); r.setProperty("--cursor", th.primaryColor); }
}
window.addEventListener("message", ev => {
  const d = ev.data; if (!d || d.type !== "streamlit:render") return;
  applyTheme(d.theme);
  const first = !D, lenChanged = D && Math.abs(D.duration - d.args.duration) > 0.5;
  D = d.args; edits = {};
  if (first) { view.start = 0; view.span = Math.max(D.duration, 4); $("hint").textContent = HINT; }
  else if (lenChanged) view.span = Math.max(view.span, 4);
  if (playing === "M" && !D.mix_url) stop();
  if (playing === "J" && !D.join_audio) { stopJoin(); }
  swapJoin();
  setButtons(); draw(); setHeight();
});
window.addEventListener("resize", () => { draw(); setHeight(); });
post("streamlit:componentReady", {apiVersion: 1});
requestAnimationFrame(loop);
</script>
